# Checks for the Python document service (service/).
name: Python service

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: service

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      # ruff is pinned here so a new ruff release can't turn CI red by itself.
      - run: pip install -e ".[dev]" ruff==0.14.0
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest
