<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ConsentLink · Consent form</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="logo-180.png">
<meta name="theme-color" content="#1FAF84">
<script src="config.js"></script>
<style>
  :root {
    --primary: #202D5B; --ink: #111614; --muted: #4A5450; --subtle: #8A9390;
    --line: #E4E7E5; --canvas: #F2F3F1; --surface: #FFFFFF; --lav: #E8EBF5;
    --hl: #FFF3C6; --ok: #0F6B50; --ok-fill: #E7F6F0; --warn: #7A4700; --warn-fill: #FEF4E2;
    --scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--surface); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 20px 120px; min-height: 100vh; }
  .eyebrow { color: var(--subtle); font-family: inherit; font-weight: 500; font-size: 13px; margin: 0; }
  h1 { font-size: calc(30px * var(--scale)); line-height: 1.2; margin: 6px 0 10px; }
  p.lead { font-size: calc(17px * var(--scale)); line-height: 1.47; color: var(--muted); margin: 0 0 20px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .inst { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: #fff;
          display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
  .head .name { flex: 1; min-width: 0; }
  .head .name b { display: block; font-size: 17px; font-weight: 600; }
  .round { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--canvas);
           color: var(--ink); font-weight: 700; font-size: 15px; display: grid; place-items: center; flex: none; }
  .progress { height: 8px; border-radius: 4px; background: var(--line); margin: 0 0 22px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
  .label { font-weight: 600; font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
  .chip { min-height: 46px; padding: 0 20px; border-radius: 23px; border: 0; background: var(--canvas);
          color: var(--ink); font-family: inherit; font-weight: 600; font-size: 15px; }
  .chip[aria-pressed="true"] { background: var(--primary); color: #fff; }
  .card { background: var(--canvas); border-radius: 24px; padding: 16px; margin: 0 0 14px; }
  .card.lav { background: var(--lav); color: var(--primary); font-weight: 500; font-size: 14px; line-height: 1.5; }
  .row { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 12px; }
  .row:last-child { margin-bottom: 0; }
  .row b { display: block; font-size: 15px; }
  .row span { color: var(--subtle); font-size: 13px; }
  .tick { color: var(--ok); font-weight: 700; }
  .sentence { display: block; font-size: calc(20px * var(--scale)); line-height: 1.5; color: var(--subtle);
              padding: 4px 8px; margin: 0 -8px 6px; border-radius: 14px; cursor: pointer; }
  .sentence.on { background: var(--hl); color: var(--ink); font-weight: 600; }
  .listen { display: flex; gap: 16px; align-items: center; background: var(--lav); border-radius: 24px;
            padding: 16px; margin: 22px 0 14px; color: var(--primary); }
  .listen button { width: 60px; height: 60px; border-radius: 30px; border: 0; background: var(--primary);
                   color: #fff; font-size: 20px; flex: none; }
  .listen b { display: block; font-size: 16px; }
  .listen small { font-size: 12px; font-weight: 500; }
  .track { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 6px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--primary); }
  .outline { width: 100%; min-height: 56px; border-radius: 28px; border: 1.5px solid var(--line);
             background: var(--surface); font-family: inherit; font-weight: 600; font-size: 16px; color: var(--ink); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
         background: linear-gradient(rgba(255,255,255,0), var(--surface) 28%); }
  .bar > div { max-width: 520px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { min-height: 60px; border-radius: 30px; border: 0; font-family: inherit; font-weight: 600; font-size: 16px; flex: 1; }
  .btn.primary { background: var(--primary); color: #fff; flex: 2; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .btn:disabled { opacity: .4; }
  .yn { display: flex; gap: 16px; margin-top: 14px; }
  .yn button { flex: 1; min-height: 54px; border-radius: 27px; border: 1.5px solid var(--line);
               background: var(--surface); font-family: inherit; font-weight: 600; font-size: 16px; color: var(--ink); }
  .yn button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .choice-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .choice-head b { font-size: 16px; padding-top: 6px; }
  .speak { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--surface); color: var(--primary); flex: none; }
  canvas { width: 100%; height: 210px; display: block; background: var(--canvas); border: 1.5px solid var(--line);
           border-radius: 24px; touch-action: none; }
  .clear { display: block; margin: 6px 4px 0 auto; background: none; border: 0; color: var(--primary);
           font-family: inherit; font-weight: 600; font-size: 14px; min-height: 40px; }
  .center { text-align: center; }
  .badge { width: 80px; height: 80px; border-radius: 40px; display: grid; place-items: center;
           margin: 80px auto 26px; font-size: 38px; }
  .badge.ok { background: var(--ok-fill); color: var(--ok); }
  .badge.warn { background: var(--warn-fill); color: var(--warn); }
  .ref { font-size: 26px; font-weight: 700; letter-spacing: .5px; margin: 6px 0; }
  .error { color: #E5484D; font-size: 14px; margin: 8px 0 0; }
  dialog { border: 0; border-radius: 24px; padding: 20px; max-width: 360px; }
  dialog::backdrop { background: rgba(11,16,14,.45); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="eyebrow">Loading the consent form…</p></main>
<div class="bar hidden" id="bar"><div id="barInner"></div></div>
<dialog id="ask"><h2 style="margin:0 0 8px;font-size:20px">Ask the researcher</h2>
  <p id="askText" style="margin:0 0 16px;line-height:1.5;color:#4A5450"></p>
  <button class="outline" onclick="document.getElementById('ask').close()">OK</button></dialog>
<script>
(() => {
  const cfg = window.CONSENTLINK || {};
  const token = new URLSearchParams(location.search).get('t') || '';
  const app = document.getElementById('app');
  const bar = document.getElementById('bar');
  const barInner = document.getElementById('barInner');
  const names = { en: 'English', af: 'Afrikaans', de: 'Deutsch', hz: 'Otjiherero',
    naq: 'Khoekhoegowab', ktz: "Ju/'hoansi", kwn: 'Rukwangali', loz: 'Silozi',
    ng: 'Oshindonga', kj: 'Oshikwanyama' };
  // Only languages a browser voice really speaks (never a Namibian language
  // with another language's voice: language pack rule).
  const voices = { en: 'en', af: 'af', de: 'de' };
  const labels = { purpose: 'Purpose of the study', procedures: 'What you will do',
    duration: 'How long it takes', risks: 'Risks', benefits: 'Possible benefits',
    compensation: 'Payment', confidentiality: 'Confidentiality',
    voluntary_withdrawal: 'Your choice', contacts_researcher: 'Who to ask',
    contacts_ethics: 'Complaints' };
  const questions = { purpose: 'What is this study about?', procedures: 'What will I do?',
    duration: 'How long will it take?', risks: 'Is there any risk to me?',
    benefits: 'Will this help me?', compensation: 'Will I be paid?',
    confidentiality: 'Who will see my answers?', voluntary_withdrawal: 'Do I have to take part?',
    contacts_researcher: 'Who can I ask?', contacts_ethics: 'Who can I complain to?' };
  let form = null, language = 'en', index = 0, sentence = 0, playing = false, decision = null, big = false;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = (s) => (s || 'CL').split(/\s+/).filter((w) => /^[A-Z]/.test(w)).slice(0, 2).map((w) => w[0]).join('') || 'CL';

  async function rpc(name, body) {
    const res = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${name}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: cfg.publishableKey,
                 Authorization: `Bearer ${cfg.publishableKey}` },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function complete(sections) {
    const by = {};
    for (const s of sections) (by[s.language] ||= new Set()).add(s.element || s.order);
    const base = by.en || Object.values(by).reduce((a, b) => (a.size >= b.size ? a : b), new Set());
    return Object.keys(by).filter((l) => [...base].every((k) => by[l].has(k)))
      .sort((a, b) => (a === 'en' ? -1 : b === 'en' ? 1 : a.localeCompare(b)));
  }
  const sections = () => form.sections.filter((s) => s.language === language).sort((a, b) => a.order - b.order);
  const split = (t) => t.split(/(?<=[.!?])\s+/).map((x) => x.trim()).filter(Boolean);

  function setBar(html) { barInner.innerHTML = html; bar.classList.toggle('hidden', !html); }
  function stop() { playing = false; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function header(eyebrow, title) {
    return `<div class="head"><div class="inst">${esc(initials(form.institution))}</div>
      <div class="name"><p class="eyebrow">${esc(eyebrow)}</p><b>${esc(title)}</b></div>
      <button class="round" id="aa" aria-label="Larger text">Aa</button></div>`;
  }
  function bindAa() {
    const b = document.getElementById('aa');
    if (b) b.onclick = () => { big = !big; document.documentElement.style.setProperty('--scale', big ? 1.25 : 1); };
  }

  // 14.7
  function problem(text) {
    stop(); setBar('');
    app.innerHTML = `<div class="badge warn" aria-hidden="true">!</div>
      <h1 class="center">This link can’t be used</h1>
      <p class="lead center">${esc(text)}</p>
      <div class="card"><b>Other reasons you may see</b>
        <p style="margin:8px 0 0;line-height:1.6;color:#4A5450">• The study is closed<br>• The link was used as many times as allowed<br>• The study includes people under 18, so consent is taken in person</p></div>`;
  }

  // 14.2
  function start() {
    stop();
    const langs = complete(form.sections);
    if (!langs.includes(language)) language = langs[0];
    const n = sections().length;
    app.innerHTML = `<div class="head"><div class="inst">${esc(initials(form.institution))}</div>
        <div class="name"><p class="eyebrow">${esc(form.institution || 'ConsentLink')}</p><b>Consent form</b></div></div>
      <h1>${esc(form.title)}</h1>
      <p class="lead">You are asked to take part in a study. Read the form, then choose. Taking part is your choice.</p>
      <p class="label">Choose your language</p>
      <div class="chips" role="group" aria-label="Language">
        ${langs.map((l) => `<button class="chip" data-lang="${l}" aria-pressed="${l === language}">${esc(names[l] || l)}</button>`).join('')}
      </div>
      <div class="card">
        <div class="row"><span class="tick">✓</span><div><b>${n} short sections</b><span>Each one answers a question you may have</span></div></div>
        <div class="row"><span class="tick">✓</span><div><b>About ${Math.max(2, Math.round(n * 0.7))} minutes</b><span>${voices[language] && 'speechSynthesis' in window ? 'You can listen to it read aloud' : 'Read at your own pace'}</span></div></div>
        <div class="row"><span class="tick">✓</span><div><b>Nothing is saved until you choose</b><span>You can stop and close this page</span></div></div>
      </div>`;
    app.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => { language = b.dataset.lang; start(); });
    setBar('<button class="btn primary" id="go">Start reading ›</button>');
    document.getElementById('go').onclick = () => { index = 0; sentence = 0; read(); };
  }

  // 14.3
  function read() {
    stop();
    const all = sections(); const s = all[index]; const parts = split(s.text);
    const canSpeak = voices[language] && 'speechSynthesis' in window;
    app.innerHTML = `${header(`Section ${index + 1} of ${all.length}`, labels[s.element] || `Section ${index + 1}`)}
      <div class="progress"><i style="width:${((index + 1) / all.length) * 100}%"></i></div>
      <h1>${esc(questions[s.element] || 'What does this part say?')}</h1>
      <div id="sentences">${parts.map((p, i) => `<span class="sentence${i === sentence ? ' on' : ''}" data-i="${i}">${esc(p)}</span>`).join('')}</div>
      <div class="listen">
        <button id="play" aria-label="${canSpeak ? 'Read aloud' : 'Read aloud not available'}" ${canSpeak ? '' : 'disabled style="opacity:.4"'}>${playing ? '❚❚' : '▶'}</button>
        <div style="flex:1"><b>Read aloud · ${esc(names[language] || language)}</b>
          <div class="track"><i style="width:${((sentence + 1) / parts.length) * 100}%"></i></div>
          <small>${canSpeak ? 'Tap a sentence to hear it again' : 'This browser has no voice for this language'}</small></div>
      </div>
      <button class="outline" id="askBtn">ⓘ  I have a question</button>`;
    bindAa();
    app.querySelectorAll('.sentence').forEach((el) => el.onclick = () => { sentence = +el.dataset.i; read(); if (canSpeak) say(parts, sentence); });
    document.getElementById('play').onclick = () => { if (playing) { stop(); read(); } else { say(parts, sentence); } };
    document.getElementById('askBtn').onclick = () => {
      const c = form.sections.find((x) => x.language === language && x.element === 'contacts_researcher');
      document.getElementById('askText').textContent = c ? c.text : 'Ask the researcher who shared this link. You can also stop and ask before you choose.';
      document.getElementById('ask').showModal();
    };
    setBar(`<button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">${index === all.length - 1 ? 'Continue ›' : 'Next ›'}</button>`);
    document.getElementById('back').onclick = () => { if (index === 0) start(); else { index--; sentence = 0; read(); } };
    document.getElementById('next').onclick = () => { if (index === all.length - 1) choose(); else { index++; sentence = 0; read(); } };
  }
  function say(parts, from) {
    stop(); playing = true;
    const speakOne = (i) => {
      if (!playing || i >= parts.length) { playing = false; read(); return; }
      sentence = i;
      document.querySelectorAll('.sentence').forEach((el) => el.classList.toggle('on', +el.dataset.i === i));
      const u = new SpeechSynthesisUtterance(parts[i]); u.lang = voices[language]; u.rate = 0.9;
      u.onend = () => speakOne(i + 1);
      speechSynthesis.speak(u);
    };
    const btn = document.getElementById('play'); if (btn) btn.textContent = '❚❚';
    speakOne(from);
  }

  // 14.4
  function choose() {
    stop();
    app.innerHTML = `<div class="progress"><i style="width:88%"></i></div>
      <p class="eyebrow">Almost done</p><h1>Your choice</h1>
      <p class="lead">Saying no is OK. It will not change how you are treated.</p>
      <div class="card"><div class="choice-head"><b>I agree to take part in this study</b>
        ${voices[language] && 'speechSynthesis' in window ? '<button class="speak" id="hear" aria-label="Read aloud">🔈</button>' : ''}</div>
        <div class="yn"><button data-d="yes" aria-pressed="${decision === 'yes'}">✓ Yes</button>
          <button data-d="no" aria-pressed="${decision === 'no'}">✕ No</button></div></div>
      <div class="card lav">You can stop later too. Tell the researcher and they will record it. You do not have to give a reason.</div>`;
    app.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { decision = b.dataset.d; choose(); });
    const hear = document.getElementById('hear');
    if (hear) hear.onclick = () => { const u = new SpeechSynthesisUtterance('I agree to take part in this study'); u.lang = voices[language]; speechSynthesis.speak(u); };
    setBar(`<button class="btn ghost" id="back">Back</button><button class="btn primary" id="next" ${decision ? '' : 'disabled'}>${decision === 'no' ? 'Send my answer' : 'Continue'}</button>`);
    document.getElementById('back').onclick = () => { index = sections().length - 1; read(); };
    document.getElementById('next').onclick = () => (decision === 'yes' ? sign() : submit(null));
  }

  // 14.5
  function sign() {
    const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    app.innerHTML = `<div class="progress"><i style="width:100%"></i></div>
      <p class="eyebrow">Last step</p><h1>Sign with your finger</h1>
      <p class="lead">Your signature shows you agree to take part in “${esc(form.title)}”.</p>
      <canvas id="pad" aria-label="Signature area"></canvas>
      <button class="clear" id="clear">Clear</button>
      <p class="eyebrow" style="margin:4px 0 16px">Signed today, ${esc(today)} · ${esc(names[language] || language)}</p>
      <div class="card" style="color:#4A5450;font-size:14px;line-height:1.5">Only the research team sees your signature. Your name is never written next to your answers.</div>
      <p class="error" id="err"></p>`;
    const pad = document.getElementById('pad');
    const ratio = window.devicePixelRatio || 1;
    pad.width = pad.clientWidth * ratio; pad.height = pad.clientHeight * ratio;
    const ctx = pad.getContext('2d');
    ctx.scale(ratio, ratio); ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#202D5B';
    let drawing = false, inked = false;
    const pos = (e) => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    pad.onpointerdown = (e) => { drawing = true; pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
    pad.onpointermove = (e) => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); if (!inked) { inked = true; send.disabled = false; } };
    pad.onpointerup = pad.onpointercancel = () => { drawing = false; };
    document.getElementById('clear').onclick = () => { ctx.clearRect(0, 0, pad.width, pad.height); inked = false; send.disabled = true; };
    setBar('<button class="btn ghost" id="back">Back</button><button class="btn primary" id="send" disabled>✓ Sign and send</button>');
    document.getElementById('back').onclick = choose;
    const send = document.getElementById('send');
    send.onclick = () => {
      if (!inked) return;
      const out = document.createElement('canvas'); out.width = pad.width; out.height = pad.height;
      const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); o.drawImage(pad, 0, 0);
      submit(out.toDataURL('image/png').split(',')[1]);
    };
  }

  async function submit(signature) {
    const button = document.getElementById('send') || document.getElementById('next');
    const label = button ? button.textContent : '';
    if (button) { button.disabled = true; button.textContent = 'Sending…'; }
    const fail = (msg) => {
      if (button) { button.disabled = false; button.textContent = label; }
      const err = document.getElementById('err');
      if (err) err.textContent = msg; else alert(msg);
    };
    try {
      const r = await rpc('link_submit', { p_token: token, p_language: language, p_decision: decision,
        p_signature: signature, p_signed_at: new Date().toISOString() });
      if (!r.ok) return /expired|used as many|closed|under 18/.test(r.reason) ? problem(r.reason) : fail(r.reason);
      thanks(r.reference);
    } catch (e) { fail('No connection. Check your internet and try again.'); }
  }

  // 14.6
  function thanks(reference) {
    stop(); setBar('');
    app.innerHTML = `<div class="badge ok" aria-hidden="true">✓</div>
      <h1 class="center">Thank you</h1>
      <p class="lead center">${decision === 'yes' ? 'Your consent was recorded.' : 'Your answer was recorded. You are not taking part.'}</p>
      <div class="card"><p class="eyebrow">Your reference</p><p class="ref">${esc(reference)}</p>
        <p class="eyebrow" style="margin:0">Keep it. The researcher can find your record with it.</p></div>
      <div class="card lav">Changed your mind? Tell the researcher at any time. You will be taken out of the study, with no reason needed.</div>
      <p class="eyebrow center" style="margin-top:40px">You can close this page.</p>`;
  }

  async function load() {
    if (!token || !cfg.supabaseUrl) return problem('This link is not complete. Ask the researcher for the link again.');
    try {
      const r = await rpc('link_form', { p_token: token });
      if (!r.ok) return problem(r.reason);
      if (!r.sections.length) return problem('This form has no text yet. Ask the researcher.');
      form = r;
      if (/^#[0-9a-f]{6}$/i.test(r.colour || '')) document.documentElement.style.setProperty('--primary', r.colour);
      start();
    } catch (e) { problem('The form could not load. Check your internet and open the link again.'); }
  }
  load();
})();
</script>
</body>
</html>
